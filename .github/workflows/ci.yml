name: CI

# Prueft nur die Werkzeuge, die sich selbst durchsetzen (.claude/settings.json,
# tools/live-check.sh, test/hooks-pruefen.sh, der Selbsttest von
# tools/gegenleser-repo.js) — NICHT die Anwendung selbst, die liegt im
# GymDocu-Repo. tools/live-check.sh wird hier bewusst NUR auf
# Syntax geprueft, nicht ausgefuehrt: es geht live gegen gymdocu.de ins
# offene Netz, und das waere bei jedem Push/PR ein Fremdzugriff obendrein
# flatterhaft (DNS/TLS/Netzwerk-Flakes wuerden CI grundlos rot faerben).
"on":
  push:
  pull_request:

# Workflow-Haertung (Auftrag GH, 30.09.2026, zizmor): Aktion auf der vollen
# Commit-Kennung (Version als Kommentar; ein bewegliches Tag laesst sich vom
# Betreiber der Aktion umbiegen), kein Zugangstoken im .git nach dem Checkout
# (kein Schritt schreibt oder holt per git), und nur Leserechte.
permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Syntax-Check tools/live-check.sh
        run: bash -n tools/live-check.sh

      - name: Syntax-Check test/hooks-pruefen.sh
        run: bash -n test/hooks-pruefen.sh

      - name: .claude/settings.json ist gueltiges JSON
        # Kaputtes JSON dort legt jede Claude-Code-Sitzung lahm, nicht nur CI.
        run: jq -e . .claude/settings.json > /dev/null

      - name: Hook-Waechter pruefen (pipe.sh, www.sh)
        run: sh test/hooks-pruefen.sh

      - name: Gegenleser-Selbsttest (Erlaubnisliste, Geheimnis-Riegel, Rundenriegel)
        # Laeuft ohne Netz und ohne Schluessel: https.request ist gestubbt, der
        # Klon liegt unter os.tmpdir(). Bis 13.09.2026 wurde --selbsttest
        # NIRGENDS automatisch gefahren — ein Riegel, den niemand ausfuehrt,
        # ist eine Absichtserklaerung. Exit ungleich 0 faerbt den Lauf rot.
        run: node tools/gegenleser-repo.js --selbsttest

      - name: Riegel-Selbsttest ueber zweitmeinung (Musterebene)
        # ZWEI Schritte, weil es zwei Pruefstaende sind: der obige deckt
        # Erlaubnisliste, Werkzeugpfade (suche/lies) und Rundenriegel ab; dieser
        # hier ruft selbsttestRiegel() aus tools/geheimnis-riegel.js — die
        # Musterebene (ROT/GRUEN je Muster, entferneGeheimnisse() mit
        # PEM-Bloecken und Deckeln). Nur tools/zweitmeinung.js ruft diese
        # Funktion; ohne diesen Schritt liefe sie nirgends automatisch.
        run: node tools/zweitmeinung.js --selbsttest

      - name: Syntax-Check .claude/hooks/session-start.sh
        run: sh -n .claude/hooks/session-start.sh

      - name: SessionStart-Hook pruefen (PostgreSQL-Cluster)
        run: sh test/session-start-hook-pruefen.sh

      - name: Syntax-Check tools/ausfuehr-aufbau.sh
        run: bash -n tools/ausfuehr-aufbau.sh

  # Selbsttest der AUSFUEHRENDEN Pruefspur (tools/ausfuehr-spur.js, Auftrag
  # "DeepSeek Variante 1" Teil W, 30.09.2026). Eigener Job, weil er root
  # braucht (Namensraeume, pivot_root, pg_createcluster, chown) und einen
  # eigenen Wegwerf-Cluster anlegt -- nichts davon gehoert in den Job oben.
  # Der erste Schritt druckt die Voraussetzungen, damit ein roter Erstlauf
  # NAMENTLICH zeigt, was fehlt (der Selbsttest selbst meldet unter CI=true
  # ROT mit Namen, nie SKIP); Nachinstallation nur, wenn dieser Ausdruck sie
  # als noetig zeigt. sudo nur an den Stellen, die es brauchen.
  ausfuehr-spur:
    name: Ausfuehr-Spur Selbsttest (root, Wegwerf-Cluster, Namensraeume)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Voraussetzungen drucken (kein Gate, nur Befund)
        run: |
          set +e
          echo "psql:               $(psql --version 2>&1)"
          echo "pg_createcluster:   $(command -v pg_createcluster || echo FEHLT)"
          echo "pg_lsclusters:";     pg_lsclusters 2>&1 | sed 's/^/                    /'
          echo "PostgreSQL unter /usr/lib/postgresql: $(ls /usr/lib/postgresql 2>&1 | tr '\n' ' ')"
          echo "unshare:            $(unshare --version 2>&1)"
          echo "setpriv:            $(setpriv --version 2>&1)"
          echo "pivot_root:         $(command -v pivot_root || echo FEHLT)"
          echo "runuser/flock/timeout/findmnt/ip: $(command -v runuser || echo FEHLT) $(command -v flock || echo FEHLT) $(command -v timeout || echo FEHLT) $(command -v findmnt || echo FEHLT) $(command -v ip || echo FEHLT)"
          echo "sudo ohne Passwort: $(sudo -n true 2>&1 && echo ja || echo NEIN)"
          echo "pivot_root-Faehigkeit als root: $(sudo -n unshare --mount --pid --fork --mount-proc sh -c 'mount -t tmpfs tmpfs /mnt && cd /mnt && mkdir alt && pivot_root . alt && echo ja' 2>&1)"
          echo "node:               $(node --version) ($(command -v node))"
          echo "uid ohne sudo:      $(id -u)"

      - name: Selbsttest der ausfuehrenden Spur (als root, CI=true)
        # PATH mitgeben: sudo setzt secure_path, node des Runners liegt
        # womoeglich ausserhalb davon.
        run: sudo -n env CI=true PATH="$PATH" node tools/gegenleser-repo.js --selbsttest-ausfuehrung

      - name: Selbsttest der Bauspur mit root (Eigentuemer-Fixtur, CLI-Vorbedingungen, GANZER Lauf gegen die echte Sandbox)
        # Gehoert in diesen Job, weil er root und den Wegwerf-Cluster hat: der ganze Lauf nimmt
        # die Sandbox im Modus "baustand" (Auftrag Bauspur, Planpruefung B3/A8) mit einem
        # Attrappen-Modell (https gestubbt, KEIN Netz). Ohne root meldet der Selbsttest unter
        # CI=true ROT, nie SKIP.
        run: sudo -n env CI=true PATH="$PATH" node tools/bau-spur.js --selbsttest-root

  # Selbsttest der BAUSPUR (tools/bau-spur.js, Auftrag Bauspur Qwen, 03.10.2026): Attrappen-Modell
  # mit festem Drehbuch von Werkzeugaufrufen, KEIN Netz, KEIN root, KEIN Cluster — deshalb ein
  # eigener Job ohne sudo (die Fälle mit root laufen im Job ausfuehr-spur oben).
  bau-spur:
    name: Bauspur Selbsttest (Attrappen-Modell, ohne root)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Syntax-Check tools/bau-spur.js und Selbsttest
        run: |
          node --check tools/bau-spur.js
          node --check tools/bau-spur-selbsttest.js
          node --check tools/spur-gemeinsam.js

      - name: Selbsttest der Bauspur (Pfadregeln, Schreibwerkzeuge, Budget, Riegel, Endvergleich)
        # Jede Regel in beide Richtungen, Sollwerte als Literale, Sollzahl der Faelle von Hand.
        run: node tools/bau-spur.js --selbsttest
