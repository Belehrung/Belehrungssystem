name: CI

# Prueft nur die Werkzeuge, die sich selbst durchsetzen (.claude/settings.json,
# tools/live-check.sh, test/hooks-pruefen.sh, der Selbsttest von
# tools/gegenleser-repo.js) — NICHT die Anwendung selbst, die liegt im
# GymDocu-Repo. tools/live-check.sh wird hier bewusst NUR auf
# Syntax geprueft, nicht ausgefuehrt: es geht live gegen gymdocu.de ins
# offene Netz, und das waere bei jedem Push/PR ein Fremdzugriff obendrein
# flatterhaft (DNS/TLS/Netzwerk-Flakes wuerden CI grundlos rot faerben).
"on":
  push:
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-Check tools/live-check.sh
        run: bash -n tools/live-check.sh

      - name: Syntax-Check test/hooks-pruefen.sh
        run: bash -n test/hooks-pruefen.sh

      - name: .claude/settings.json ist gueltiges JSON
        # Kaputtes JSON dort legt jede Claude-Code-Sitzung lahm, nicht nur CI.
        run: jq -e . .claude/settings.json > /dev/null

      - name: Hook-Waechter pruefen (pipe.sh, www.sh)
        run: sh test/hooks-pruefen.sh

      - name: Gegenleser-Selbsttest (Erlaubnisliste, Geheimnis-Riegel, Rundenriegel)
        # Laeuft ohne Netz und ohne Schluessel: https.request ist gestubbt, der
        # Klon liegt unter os.tmpdir(). Bis 13.09.2026 wurde --selbsttest
        # NIRGENDS automatisch gefahren — ein Riegel, den niemand ausfuehrt,
        # ist eine Absichtserklaerung. Exit ungleich 0 faerbt den Lauf rot.
        run: node tools/gegenleser-repo.js --selbsttest

      - name: Riegel-Selbsttest ueber zweitmeinung (Musterebene)
        # ZWEI Schritte, weil es zwei Pruefstaende sind: der obige deckt
        # Erlaubnisliste, Werkzeugpfade (suche/lies) und Rundenriegel ab; dieser
        # hier ruft selbsttestRiegel() aus tools/geheimnis-riegel.js — die
        # Musterebene (ROT/GRUEN je Muster, entferneGeheimnisse() mit
        # PEM-Bloecken und Deckeln). Nur tools/zweitmeinung.js ruft diese
        # Funktion; ohne diesen Schritt liefe sie nirgends automatisch.
        run: node tools/zweitmeinung.js --selbsttest

      - name: Syntax-Check .claude/hooks/session-start.sh
        run: sh -n .claude/hooks/session-start.sh

      - name: Syntax-Check test/session-start-hook-pruefen.sh
        run: sh -n test/session-start-hook-pruefen.sh

      - name: SessionStart-Hook pruefen (PostgreSQL-Cluster)
        run: sh test/session-start-hook-pruefen.sh
